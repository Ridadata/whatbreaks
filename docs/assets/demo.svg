<svg xmlns="http://www.w3.org/2000/svg" width="842" height="303" viewBox="0 0 842 303" role="img" aria-label="whatbreaks detecting a breaking dbt change">
<style>
  .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; white-space: pre; }
  .row { opacity: 1; }
  @keyframes reveal { from { opacity: 0 } to { opacity: 1 } }
  @keyframes typing { from { width: 0 } to { width: 100% } }
  @media (prefers-reduced-motion: no-preference) {
    .row { animation: reveal 0.28s ease-out backwards; }
  }
</style>
<rect width="842" height="303" rx="10" fill="#12141a"/>
<rect width="842" height="34" rx="10" fill="#1b1e26"/>
<rect y="24" width="842" height="10" fill="#1b1e26"/>
<circle cx="20" cy="17" r="5" fill="#ff5f57"/>
<circle cx="38" cy="17" r="5" fill="#febc2e"/>
<circle cx="56" cy="17" r="5" fill="#28c840"/>
<text class="t" x="421" y="22" fill="#6e7681" text-anchor="middle" font-size="11">whatbreaks / quickstart example</text>
<g class="row" style="animation-duration:1.40s"><text class="t" x="22" y="52"><tspan fill="#7ee787">$ </tspan><tspan fill="#79c0ff">whatbreaks</tspan><tspan fill="#c9d1d9"> check --base base/target/manifest.json --head target/manifest.json</tspan></text></g>
<g class="row" style="animation-delay:1.40s"><text class="t" x="22" y="73" fill="#f47067">BREAKING  WB001  column stg_orders.status was removed</text></g>
<g class="row" style="animation-delay:1.50s"><text class="t" x="22" y="94" fill="#c9d1d9">          still referenced by: customers, orders; breaks 1 column, 2 models, 1 test, 1 exposure</text></g>
<g class="row" style="animation-delay:1.60s"><text class="t" x="22" y="115" fill="#6e7681">          confidence: likely</text></g>
<g class="row" style="animation-delay:1.70s"><text class="t" x="22" y="136" fill="#6e7681">    info  WB900  orders could not be compared</text></g>
<g class="row" style="animation-delay:1.80s"><text class="t" x="22" y="157" fill="#c9d1d9">          head schema is partial</text></g>
<g class="row" style="animation-delay:1.90s"><text class="t" x="22" y="178" fill="#6e7681">          confidence: unknown</text></g>
<g class="row" style="animation-delay:2.10s"><text class="t" x="22" y="220" fill="#6e7681">analysed 3/3 models (100.0%) - 2 exact, 1 partial, 0 not analysed</text></g>
<g class="row" style="animation-delay:2.20s"><text class="t" x="22" y="241" fill="#6e7681">      1  qualify_error</text></g>
<g class="row" style="animation-delay:2.30s"><text class="t" x="22" y="262" fill="#d8a657">note: some models could not be fully analysed, so there may be further impact we cannot see</text></g>
<rect x="22" y="270" width="8" height="15" fill="#6e7681"><animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="2.40s" repeatCount="indefinite"/></rect>
</svg>
