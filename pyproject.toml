[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatbreaks"
version = "0.1.0.dev0"
description = "Static breaking-change analysis for dbt. Column-level blast radius in CI - no warehouse, no secrets, no backend."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rida Aderkane" }]
keywords = ["dbt", "sql", "lineage", "data-engineering", "ci", "linter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

# Deliberately tiny. This runs in CI; install time and supply-chain surface
# are features, not afterthoughts. See WHATBREAKS_PROJECT_PLAN.md NFRs.
dependencies = [
    "sqlglot>=25.0",
    "jinja2>=3.1",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
whatbreaks = "whatbreaks.cli:main"

[project.urls]
Homepage = "https://github.com/Ridadata/whatbreaks"
Issues = "https://github.com/Ridadata/whatbreaks/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/whatbreaks"]

# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# .phase0 holds cloned third-party dbt projects and a venv (multi-GB). Excluded
# explicitly rather than relying on .gitignore, so linting works outside a repo.
extend-exclude = [".phase0", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF"]
ignore = [
    "SIM108",  # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tools/**" = ["ALL"]        # Phase 0 research scripts, kept for reproducibility

# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src/whatbreaks"]

[[tool.mypy.overrides]]
module = "sqlglot.*"
ignore_missing_imports = true

# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "corpus: golden-file lineage tests over the difficult-SQL corpus",
    "oracle: slow tests that run real dbt against DuckDB for ground truth",
]

[tool.coverage.run]
source = ["src/whatbreaks"]
branch = true

