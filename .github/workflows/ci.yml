name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. Nothing in CI needs write access, and whatbreaks
# itself must never require secrets -- that property is what lets it run on
# pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check src tests
      - name: mypy (strict)
        run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing

  false-positive-gate:
    # A RELEASE GATE, not a test suite. A linter's false-positive rate decides
    # whether it survives contact with a real team far more than its feature
    # count does: one wrong BREAKING on a reformatting commit and it gets
    # removed from the workflow that week.
    #
    # Run as its own required job so a regression here is unmissable rather
    # than one red dot among two hundred.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: no-op changes must raise no alarm
        run: uv run pytest tests/false_positives -v

  # NOTE: the "never touches the network" guarantee is enforced by an autouse
  # fixture in tests/conftest.py that blocks socket creation for every
  # non-oracle test, so it is covered by the `test` job above rather than
  # needing a separate one.
